<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #abd4fc;
        }
        .container {
            max-width: 600px;
            background: rgb(245, 248, 249);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center text-warning mb-4">✏️ Edit Question</h2>
        <form action="/edit_question/{{ question.id }}" method="POST" onsubmit="return confirmEdit();">
            <div class="mb-3">
                <label for="question_title" class="form-label">Question Title</label>
                <input type="text" class="form-control" id="question_title" name="question_title" value="{{ question.question_title }}" required>
            </div>
            <div class="mb-3">
                <label for="question_statement" class="form-label">Question Statement</label>
                <textarea class="form-control" id="question_statement" name="question_statement" rows="3" required>{{ question.question_statement }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Options</label>
                <input type="text" class="form-control mb-2" name="option1" value="{{ question.option1 }}" required>
                <input type="text" class="form-control mb-2" name="option2" value="{{ question.option2 }}" required>
                <input type="text" class="form-control mb-2" name="option3" value="{{ question.option3 }}" required>
                <input type="text" class="form-control mb-2" name="option4" value="{{ question.option4 }}" required>
            </div>
            <div class="mb-3">
                <label for="correct_option" class="form-label">Correct Option</label>
                <select class="form-control" id="correct_option" name="correct_option" required>
                    <option value="1" {% if question.correct_option == "1" %}selected{% endif %}>Option 1</option>
                    <option value="2" {% if question.correct_option == "2" %}selected{% endif %}>Option 2</option>
                    <option value="3" {% if question.correct_option == "3" %}selected{% endif %}>Option 3</option>
                    <option value="4" {% if question.correct_option == "4" %}selected{% endif %}>Option 4</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">✅ Save Changes</button>
        </form>
    </div>


</body>
</html>
