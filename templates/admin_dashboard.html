<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand" > Admin Dashboard</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link text-white" >👤{{admin_name}}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="login">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 text-center">
        <h2 class="text-primary">Welcome, {{ admin_name }}! 🎉</h2>
    </div>


    <!-- Main Content -->
    <div class="container my-4">
        <div class="row g-4">
            <!-- Manage Users Card -->
            <div class="col-md-3">
                <div class="card text-center border-primary">
                    <div class="card-body">
                        <h5 class="card-title">Manage Users</h5>
                        <p class="card-text">Create, edit, or delete users.</p>
                        <a href="/user_manage" class="btn btn-primary">Go to Users</a>
                    </div>
                </div>
            </div>

            <!-- Manage Subjects Card -->
            <div class="col-md-3">
                <div class="card text-center border-success">
                    <div class="card-body">
                        <h5 class="card-title">Manage Subjects</h5>
                        <p class="card-text">Add, edit, or remove subjects.</p>
                        <a href="/subject_manage" class="btn btn-success">Go to Subjects</a>
                    </div>
                </div>
            </div>

            <!-- Manage Quizzes Card -->
            <div class="col-md-3">
                <div class="card text-center border-warning">
                    <div class="card-body">
                        <h5 class="card-title">Manage Quizzes</h5>
                        <p class="card-text">Create and manage quizzes.</p>
                        <a href="/quiz_manage" class="btn btn-warning">Go to Quizzes</a>
                    </div>
                </div>
            </div>

            <!-- Additional Features Card -->
           
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
