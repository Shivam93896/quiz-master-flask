<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #9acafa;
        }
        .container {
            max-width: 600px;
            background: rgb(245, 247, 248);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center text-primary mb-4">📝 Add a New Question</h2>
        <form action="/add_question/{{ quiz.id }}" method="POST" onsubmit="return confirmSubmit();">
            <div class="mb-3">
                <label for="question_title" class="form-label">Question Title</label>
                <input type="text" class="form-control" id="question_title" name="question_title" required>
            </div>
            <div class="mb-3">
                <label for="question_statement" class="form-label">Question Statement</label>
                <textarea class="form-control" id="question_statement" name="question_statement" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Options</label>
                <input type="text" class="form-control mb-2" name="option1" placeholder="Option 1" required>
                <input type="text" class="form-control mb-2" name="option2" placeholder="Option 2" required>
                <input type="text" class="form-control mb-2" name="option3" placeholder="Option 3" required>
                <input type="text" class="form-control mb-2" name="option4" placeholder="Option 4" required>
            </div>
            <div class="mb-3">
                <label for="correct_option" class="form-label">Correct Option</label>
                <select class="form-control" id="correct_option" name="correct_option" required>
                    <option value="">Select the correct option</option>
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">✅ Add Question</button>
        </form>
    </div>

    

</body>
</html>
