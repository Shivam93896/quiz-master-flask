<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 580px; width: 350px; margin-top: 60px;">
                <h1>Signup Form</h1>
                  <form action="/signup" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="username/admin" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullname" class="form-label">Fullname</label>
                            <input type="text" class="form-control" id="fullname" name="fullname" placeholder="fullname" required>
                        </div>
                        <div class="mb-3">
                            <label for="qualification" class="form-label"> Qualification</label>
                            <input type="text" class="form-control" id="qualification" name="qualification" placeholder="qualification" required>
                        </div>
                        <div class="mb-3">
                            <label for="dob" class="form-label"> date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob" placeholder="qualification">
                        </div>
                        <div style="text-align: center;">
                        <button type="submit" class="btn btn-primary">Signup</button> <br>
                        Already registered? <a href="/login">Login</a>
                        </div>  
                    </form>    
            </div>
        </div>
    </div>
    
</body>
</html>
