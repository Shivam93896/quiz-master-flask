<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .timer-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .timer {
            font-size: 20px;
            font-weight: bold;
            color: red;
        }
        .question {
            margin-bottom: 15px;
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Start Quiz</h1>
        <p class="text-center"><strong>Quiz Title:</strong> {{ quiz.remarks }}</p>
        <div class="timer-container">
            <div class="timer" id="timer">{{ quiz.time_of_quiz }}</div>
        </div>
        <form action="/start_quiz/{{ quiz.id }}" method="POST" id="quiz-form">
            {% for question in questions %}
            <div class="question">
                <p><strong>{{ loop.index }}. {{ question.question_statement }}</strong></p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question-{{ question.id }}" value="1">
                    <label class="form-check-label">{{ question.option1 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question-{{ question.id }}" value="2">
                    <label class="form-check-label">{{ question.option2 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question-{{ question.id }}" value="3">
                    <label class="form-check-label">{{ question.option3 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question-{{ question.id }}" value="4">
                    <label class="form-check-label">{{ question.option4 }}</label>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        let quizElement = document.getElementById('quiz-form');
        let totalTime = parseInt("{{ time }}");
        let timerElement = document.getElementById('timer');

        function updateTimer() {
            let minutes = Math.floor(totalTime / 60);
            let seconds = totalTime % 60;
            timerElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            if (totalTime > 0) {
                totalTime--;
            } else {
                clearInterval(timerInterval);
                alert('Time is up! Submitting the quiz.');
                quizElement.submit();
            }
        }

        let timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
