<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #b4d9fe;
        }
        .quiz-container {
            max-width: 500px;
            margin: 50px auto;
            background: #eaf2fc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-container">
            <h2 class="text-center mb-4">Add Quiz</h2>
            <form action="/add_quiz" method="POST">
                <div class="mb-3">
                    <label for="chapter_id" class="form-label">Chapter ID</label>
                    <input type="text" class="form-control" id="chapter_id" name="chapter_id" required>
                </div>
                <div class="mb-3">
                    <label for="date_of_quiz" class="form-label">Date of Quiz</label>
                    <input type="date" class="form-control" id="date_of_quiz" name="date_of_quiz" required>
                </div>
                <div class="mb-3">
                    <label for="time_of_quiz" class="form-label">Time Duration [HH:MM]</label>
                    <input type="time" class="form-control" id="time_of_quiz" name="time_of_quiz" required>
                </div>
                <div class="mb-3">
                    <label for="remarks" class="form-label">Quiz Title</label>
                    <input type="text" class="form-control" id="remarks" name="remarks" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Quiz</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
