<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand" > User Management</span>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                   
                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-align" href="admin_dashboard">🔙Back</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>




    <div class="container mt-4">
        <h2 class="text-center mb-4">User Management</h2>
        <table class="table table-striped table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th scope="col">User ID</th>
                    <th scope="col">User Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Status</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <th scope="row">{{ user.id }}</th>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                            {{ 'Active' if user.is_active else 'Blocked' }}
                        
                    </td>
                    <td>
                        <form action="{{ url_for('block_user', user_id=user.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger" {% if not user.is_active %}disabled{% endif %}>
                                Block
                            </button>
                        </form>
                        <form action="{{ url_for('unblock_user', user_id=user.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-success" {% if user.is_active %}disabled{% endif %}>
                                Unblock
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>    
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
